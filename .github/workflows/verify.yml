# The release gate on every push and pull request: type-check, tests, lint, web export, no
# credential in the client bundle, the patched bigint-buffer, and the supply-chain audit.
name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            server/package-lock.json
      - name: Install app
        run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Install server
        run: npm ci --no-audit --no-fund
        working-directory: server
      - name: ./verify.sh
        run: ./verify.sh
